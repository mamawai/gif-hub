[deploy]
# 明确指定启动 gh-gif 的 jar 包（多模块项目必须指定具体文件名）
startCommand = "java -Xms384m -Xmx640m -XX:MaxMetaspaceSize=128m -XX:MaxDirectMemorySize=96m -XX:ThreadStackSize=512k -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Dserver.port=$PORT $JAVA_OPTS -jar target/gh-gif-0.0.1-SNAPSHOT.jar"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
