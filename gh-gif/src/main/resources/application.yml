spring:
  application:
    name: gh-gif
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD}
      database: 0
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 550000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  mapper-locations: classpath*:./mappers/**/*.xml

server:
  port: 8080
  address: 0.0.0.0

management:
  endpoints:
    web:
      exposure:
        include: '*'

aws:
  sqs:
    base-queue-url: ${AWS_SQS_BASE_QUEUE_URL}
    email-queue-url: ${AWS_SQS_EMAIL_QUEUE_URL}
    region: ${AWS_REGION}
  access-key-id: ${AWS_ACCESS_KEY_ID}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY}

cloudflare:
  aws:
    s3:
      endpoint: ${CLOUDFLARE_S3_ENDPOINT}
      bucket-name: ${CLOUDFLARE_BUCKET_NAME}
      cdn-domain: ${CLOUDFLARE_CDN_DOMAIN}
      region: auto
      credentials:
        access-key: ${CLOUDFLARE_ACCESS_KEY}
        secret-key: ${CLOUDFLARE_SECRET_KEY}

redis:
  scanCount: 1000

openai:
  api:
    base-url: ${OPENAI_BASE_URL}
    key: ${OPENAI_API_KEY}
  moderation:
    enabled: true
    model: omni-moderation-latest
    timeout: 3000
    fail-open: true
    thresholds:
      sexual: 0.30
      sexual/minors: 0.20
      violence: 0.40
      violence/graphic: 0.35
      hate: 0.35
      hate/threatening: 0.25
      harassment: 0.45
      harassment/threatening: 0.30
      self-harm: 0.35
      self-harm/intent: 0.30
      self-harm/instructions: 0.25

giphy:
  api:
    key: ${GIPHY_API_KEY}
    base-url: https://api.giphy.com/v1/gifs