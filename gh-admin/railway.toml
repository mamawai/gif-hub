# gh-admin/railway.toml
[build]
builder = "nixpacks"
buildCommand = "mvn -DoutputFile=target/mvn-dependency-list.log -B -DskipTests clean dependency:list install -Pproduction && mkdir -p target && cp gh-admin/target/gh-admin-0.0.1-SNAPSHOT.jar target/"

[deploy]
startCommand = "java -jar target/gh-admin-0.0.1-SNAPSHOT.jar"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10