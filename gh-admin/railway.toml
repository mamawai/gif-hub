# gh-admin/railway.toml
[build]
builder = "nixpacks"
buildCommand = "mvn -B -DskipTests clean install && ls -la gh-admin/target/ && mkdir -p target && cp gh-admin/target/*.jar target/ && ls -la target/"

[deploy]
startCommand = "java -jar target/gh-admin-0.0.1-SNAPSHOT.jar"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10