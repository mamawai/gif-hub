<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIF审核管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- 侧边栏 -->
            <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-light sidebar">
                <div class="position-sticky">
                    <div class="sidebar-header">
                        <h3>GIF审核系统</h3>
                    </div>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link active" href="#" id="pending-link">
                                待审核列表
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" id="passed-link">
                                已通过列表
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" id="rejected-link">
                                已拒绝列表
                            </a>
                        </li>
                        <li class="nav-item mt-3">
                            <button class="btn btn-danger btn-sm" id="delete-all-btn">
                                批量删除已审核记录
                            </button>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- 主内容区 -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2" id="page-title">待审核GIF列表</h1>
                </div>

                <div class="table-responsive" id="table-container">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>预览</th>
                                <th>标题</th>
                                <th>描述</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="gif-list">
                            <!-- GIF列表会通过JS动态加载 -->
                        </tbody>
                    </table>
                </div>

                <!-- 分页控件 -->
                <nav aria-label="Page navigation">
                    <ul class="pagination justify-content-center" id="pagination">
                        <!-- 分页会通过JS动态加载 -->
                    </ul>
                </nav>

                <!-- 审核详情模态框 -->
                <div class="modal fade" id="auditModal" tabindex="-1" aria-labelledby="auditModalLabel" aria-hidden="true">
                    <div class="modal-dialog modal-lg">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" id="auditModalLabel">审核GIF</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                <div class="text-center mb-3">
                                    <img id="gif-preview" src="" alt="GIF预览" class="img-fluid">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">标题</label>
                                    <p id="gif-title"></p>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">描述</label>
                                    <p id="gif-description"></p>
                                </div>
                                <div class="mb-3" id="reject-reason-container" style="display: none;">
                                    <label for="reject-reason" class="form-label">拒绝原因</label>
                                    <textarea class="form-control" id="reject-reason" rows="3"></textarea>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                                <button type="button" class="btn btn-danger" id="btn-reject">拒绝</button>
                                <button type="button" class="btn btn-success" id="btn-approve">通过</button>
                                <button type="button" class="btn btn-primary d-none" id="btn-confirm-reject">确认拒绝</button>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
