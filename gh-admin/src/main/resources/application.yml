spring:
  application:
    name: gh-admin
  # 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/gif_hub?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password:
    druid:
      initial-size: 5
      min-idle: 10
      max-active: 20
  # 静态资源处理
  web:
    resources:
      static-locations: classpath:/static/

# 服务端口
server:
  port: 8081

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:./mappers/**/*.xml
