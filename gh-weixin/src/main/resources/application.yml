spring:
  application:
    name: gh-weixin
  data:
    redis:
      url: ${REDIS_URL}
#      host: ${REDIS_HOST}
#      port: ${REDIS_PORT}
#      username: ${REDIS_USERNAME:default}
#      password: ${REDIS_PASSWORD}
#      database: 0
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 3
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 550000

mybatis-plus:
  mapper-locations: classpath*:./mappers/**/*.xml

server:
  port: 8083
  address: 0.0.0.0

resend:
  api-key: ${RESEND_API_KEY}
  from-email: ${RESEND_FROM_EMAIL}

wechat:
  appId: ${WECHAT_APP_ID}
  secret: ${WECHAT_SECRET}
  grantType: authorization_code
  loginUrl: https://api.weixin.qq.com/sns/jscode2session

# GetIPIntel IP 欺诈检测配置
getipintel:
  contact:
    email: ${GETIPINTEL_CONTACT_EMAIL}
  enabled: ${GETIPINTEL_ENABLED}
  flags: ${GETIPINTEL_FLAGS}
  oflags: ${GETIPINTEL_OFLAGS}
  connect:
    timeout: ${GETIPINTEL_CONNECT_TIMEOUT}
  read:
    timeout: ${GETIPINTEL_READ_TIMEOUT}
  threshold:
    reject: ${GETIPINTEL_REJECT_THRESHOLD}

# 临时邮箱检测配置
disposable-email:
  enabled: ${DISPOSABLE_EMAIL_ENABLED}
  auto-update: ${DISPOSABLE_EMAIL_AUTO_UPDATE}
  update-cron: ${DISPOSABLE_EMAIL_UPDATE_CRON}

# Cloudflare 配置
cloudflare:
  validation:
    enabled: ${CLOUDFLARE_VALIDATION_ENABLED}

# ProxyCheck.io IP 代理检测配置
proxycheck:
  api-keys: ${PROXYCHECK_API_KEYS}
  enabled: ${PROXYCHECK_ENABLED}
  connect:
    timeout: ${PROXYCHECK_CONNECT_TIMEOUT}
  read:
    timeout: ${PROXYCHECK_READ_TIMEOUT}